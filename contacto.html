    <main>
        <h3>Formulario de Contacto</h3>
        <p>¿Tiene dudas sobre el evento? Envíanme mensaje.</p>

        <!-- formulario para mandar mail -->
        <form action="mailto:bilbaocurso@gmail.com" method="post" enctype="text/plain">
            <p>
                <label for="nombre">Nombre y Apellidos:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="30" required></textarea>
            </p>
            <p>
                <button type="submit">Enviar</button>
                <button type="reset">Limpiar</button>
            </p>
        </form>
